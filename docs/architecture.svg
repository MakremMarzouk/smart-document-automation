<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Smart Document Automation architecture</title>
  <desc id="desc">Upload flows through FastAPI, storage, extraction, Ollama, validation, PostgreSQL, and manual review.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fc; }
      .box { fill: #ffffff; stroke: #cfd5e3; stroke-width: 2; }
      .primary { fill: #eef0ff; stroke: #5b5ce2; stroke-width: 2; }
      .success { fill: #e8f8ef; stroke: #16845b; stroke-width: 2; }
      .review { fill: #fff7e8; stroke: #c47a12; stroke-width: 2; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #172033; }
      .label { font: 700 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #172033; text-anchor: middle; }
      .small { font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #667085; text-anchor: middle; }
      .arrow { stroke: #7a8498; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7a8498" />
    </marker>
  </defs>
  <rect class="bg" width="1200" height="620" rx="24" />
  <text class="title" x="60" y="58">Smart Document Automation</text>
  <text class="small" x="600" y="58">Synchronous and in-process background processing</text>

  <rect class="box" x="55" y="120" width="180" height="90" rx="16" />
  <text class="label" x="145" y="158">User / UI</text>
  <text class="small" x="145" y="183">Upload invoice</text>

  <rect class="primary" x="290" y="120" width="180" height="90" rx="16" />
  <text class="label" x="380" y="158">FastAPI API</text>
  <text class="small" x="380" y="183">Routes and tasks</text>

  <rect class="box" x="525" y="120" width="180" height="90" rx="16" />
  <text class="label" x="615" y="158">File storage</text>
  <text class="small" x="615" y="183">Incoming documents</text>

  <rect class="primary" x="760" y="120" width="180" height="90" rx="16" />
  <text class="label" x="850" y="158">Text extraction</text>
  <text class="small" x="850" y="183">PDF / TXT</text>

  <rect class="primary" x="995" y="120" width="150" height="90" rx="16" />
  <text class="label" x="1070" y="158">Ollama</text>
  <text class="small" x="1070" y="183">Structured JSON</text>

  <path class="arrow" d="M235 165 H290" />
  <path class="arrow" d="M470 165 H525" />
  <path class="arrow" d="M705 165 H760" />
  <path class="arrow" d="M940 165 H995" />

  <rect class="primary" x="410" y="330" width="220" height="95" rx="16" />
  <text class="label" x="520" y="370">Validation engine</text>
  <text class="small" x="520" y="396">Accounting rules</text>

  <rect class="box" x="720" y="330" width="200" height="95" rx="16" />
  <text class="label" x="820" y="370">PostgreSQL</text>
  <text class="small" x="820" y="396">Document state</text>

  <rect class="success" x="1000" y="285" width="150" height="80" rx="16" />
  <text class="label" x="1075" y="320">Valid</text>
  <text class="small" x="1075" y="344">Completed</text>

  <rect class="review" x="1000" y="400" width="150" height="80" rx="16" />
  <text class="label" x="1075" y="435">Needs review</text>
  <text class="small" x="1075" y="459">Manual action</text>

  <path class="arrow" d="M850 210 C850 270 520 265 520 330" />
  <path class="arrow" d="M630 377 H720" />
  <path class="arrow" d="M920 355 H1000" />
  <path class="arrow" d="M920 400 H1000" />

  <text class="small" x="600" y="550">POST /upload/auto · POST /upload/auto-background</text>
</svg>
